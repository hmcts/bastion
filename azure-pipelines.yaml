trigger: none
pr: none

stages:
  - stage: VaultPermissions
    jobs:
      - job: Sandbox
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: dts-management-sbox-intsvc
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: python3 scripts/bootstrap_wif_vault_policy.py sbox
      - job: Nonprod
        dependsOn: Sandbox
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: dts-management-nonprod-intsvc
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: python3 scripts/bootstrap_wif_vault_policy.py nonprod
      - job: Production
        dependsOn: Nonprod
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: dts-management-prod-intsvc
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: python3 scripts/bootstrap_wif_vault_policy.py prod
